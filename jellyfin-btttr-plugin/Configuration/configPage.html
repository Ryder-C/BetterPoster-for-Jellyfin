<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Btttr Posters Configuration</title>
</head>
<body>
    <div id="BtttrPostersConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input">
        <div data-role="content">
            <div class="content-primary">
                <form id="BtttrPostersConfigForm">
                    <div class="sectionTitleContainer flex align-items-center justify-content-between">
                        <h2 class="sectionTitle">Btttr Posters Configuration</h2>
                    </div>

                    <div class="verticalFormContainer">
                        <div class="inputContainer">
                            <label for="txtUrlTemplate">Btttr URL</label>
                            <input is="emby-input" type="text" id="txtUrlTemplate" name="UrlTemplate" class="emby-input" />
                            <div class="fieldDescription">
                                The URL used to fetch posters from btttr.cc. Use the placeholder
                                <code>{imdb_id}</code>, which is replaced with each item's IMDb ID at request time.
                                Example: <code>https://btttr.cc/poster-n/imdb/poster-default/{imdb_id}.jpg?tag=none</code>
                            </div>
                        </div>

                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save Configuration</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var BtttrConfig = {
            pluginUniqueId: 'b1ea6fb2-e42a-4632-841f-82ffba8307db'
        };

        document.querySelector('#BtttrPostersConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(BtttrConfig.pluginUniqueId).then(function (config) {
                document.querySelector('#txtUrlTemplate').value = config.UrlTemplate || '';
                Dashboard.hideLoadingMsg();
            });
        });

        document.querySelector('#BtttrPostersConfigForm').addEventListener('submit', function (e) {
            e.preventDefault();
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(BtttrConfig.pluginUniqueId).then(function (config) {
                config.UrlTemplate = document.querySelector('#txtUrlTemplate').value;
                ApiClient.updatePluginConfiguration(BtttrConfig.pluginUniqueId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                });
            });
            return false;
        });
    </script>
</body>
</html>
